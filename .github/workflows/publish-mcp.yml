name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for GitHub OIDC authentication

jobs:
  validate-and-publish:
    name: Validate and Publish to MCP Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript artifacts
        run: npm run build

      - name: Run automated test suite & schema validation
        run: npm test

      - name: Install official mcp-publisher CLI
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          TARBALL="mcp-publisher_${OS}_${ARCH}.tar.gz"
          echo "Downloading $TARBALL from latest release..."
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/${TARBALL}" | tar -xz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher --version || echo "mcp-publisher ready"

      - name: Authenticate with MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish
